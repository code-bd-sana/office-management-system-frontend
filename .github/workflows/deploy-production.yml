name: Deploy frontend to production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oms-frontend-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and deploy frontend
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend against production API
        env:
          NEXT_PUBLIC_API_URL: https://api.fbinternationalbd.com
        run: npm run build

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy the tested commit and restart frontend
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "COMMIT_SHA='$COMMIT_SHA' bash -s" <<'REMOTE_SCRIPT'
          set -Eeuo pipefail
          cd /var/www/oms/frontend

          git fetch --prune origin main
          git cat-file -e "${COMMIT_SHA}^{commit}"
          git reset --hard "$COMMIT_SHA"

          # Browser-visible Next.js variables must exist before this build.
          printf 'NEXT_PUBLIC_API_URL=https://api.fbinternationalbd.com\n' > .env.production
          chmod 600 .env.production

          npm ci
          npm run build

          pm2 restart oms-frontend --update-env
          pm2 save

          sleep 3
          curl --fail --silent --show-error http://127.0.0.1:3000 > /dev/null
          REMOTE_SCRIPT
